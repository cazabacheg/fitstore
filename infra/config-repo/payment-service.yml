# payment-service (micro payment, sección 10.5). Sin secretos: solo ${VARIABLES} que salen del .env de cada contenedor.
server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/payment_db
    username: ${PAYMENT_DB_USER}
    password: ${PAYMENT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # el esquema lo maneja Flyway

# Documentación OpenAPI 3.0 para oasdiff (contracts K2, SPEC-0a I8)
springdoc:
  api-docs:
    version: openapi_3_0

fitstore:
  eventos:
    servicio: payment           # exchange fitstore.eventos; cola payment.eventos (+ .dlq) enlazada a lo que consume
    enlaces:
      - order.pedido.creado
      - order.pedido.cancelado
      - order.pedido.expirado
      - order.pago.no-aplicable
      - order.reembolso.solicitado
  outbox:
    habilitado: true
    intervalo-ms: 1000
  storage:
    habilitado: true
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION:garage}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket-privado: ${S3_BUCKET_PRIVADO:fitstore-privado}     # boletas/{anio}/{numero}.pdf
  pagos:
    culqi: { public-key: "${CULQI_PUBLIC_KEY:}", secret-key: "${CULQI_SECRET_KEY:}", url: "https://api.culqi.com/v2", timeout: 10s }
    mercadopago: { public-key: "${MP_PUBLIC_KEY:}", access-token: "${MERCADOPAGO_ACCESS_TOKEN:}", webhook-secret: "${MP_WEBHOOK_SECRET:}", timeout: 10s }
    simulado.habilitado: false  # solo por configuración técnica (D7): true en -dev, ${PAGOS_SIMULADO_HABILITADO:false} en -cloud
    yape.tope-diario: 500.00
    verificador: { cada: 2m, antiguedad: 2m }
    reembolsos.esperas: [1m, 5m, 15m, 60m]
    boleta: { serie: B001, leyenda: "Documento simulado sin validez tributaria" }
    settings-cache-ttl: 5m
