# settings-service (micro settings 10.5). Sin secretos: solo ${VARIABLES}.
server:
  port: 8087

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/settings_db
    username: ${SETTINGS_DB_USER}
    password: ${SETTINGS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Flyway
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  api-docs:
    version: openapi_3_0

fitstore:
  eventos:
    servicio: settings   # settings publica; no consume (sin enlaces)
  outbox:
    habilitado: true
    intervalo-ms: 1000
  storage:
    habilitado: true
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION:garage}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket-publico: ${S3_BUCKET_PUBLICO:fitstore-media}
    media-base-url: ${MEDIA_BASE_URL}
  settings:
    cache-ttl:
      publica: 1h
      ubigeo: 24h
    imagenes:
      logo-max: 2MB
      landing-max: 5MB
      landing-ancho: 1600
      landing-max-cantidad: 5
    reclamos:
      plazo-dias-habiles: 15
      por-vencer-dias: 3
      serie: RC
