# Configuración común a todos los servicios (infraestructura 10.5).
# Sin secretos: los valores sensibles se resuelven desde variables de entorno de cada contenedor (.env fuera de Git).
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka
  instance:
    prefer-ip-address: true

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    # El outbox marca una fila como publicada solo cuando RabbitMQ confirma (infraestructura 8)
    publisher-confirm-type: correlated
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      # Si Redis no responde, que falle rápido: los servicios degradan sin él (ADR-020)
      timeout: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://jaeger:4318/v1/traces

# Logs estructurados en consola
logging:
  structured:
    format:
      console: ecs

# Resilience4j: la configuración base (50 %, ventana 10, 10 s abierto, timeout 10 s) viene de fitstore-common
# y se ajusta con fitstore.resilience.* (umbral-fallos, ventana, espera-abierto-ms, llamadas-semiabierto, timeout-ms)
---
# Muestreo de trazas: 100 % en dev
spring:
  config:
    activate:
      on-profile: dev
management:
  tracing:
    sampling:
      probability: 1.0
---
# Muestreo de trazas: 20 % en cloud
spring:
  config:
    activate:
      on-profile: cloud
management:
  tracing:
    sampling:
      probability: 0.2
