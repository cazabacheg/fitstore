# notification-service (micro notification, 10.5). Sin secretos: solo ${VARIABLES} del entorno (.env fuera de Git).
server:
  port: 8086

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/notification_db
    username: ${NOTIFICATION_DB_USER}
    password: ${NOTIFICATION_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # el esquema lo maneja Flyway
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST}          # dev: mailpit · cloud: email-smtp.<region>.amazonaws.com
    port: ${SMTP_PORT:1025}     # cloud: 587 con STARTTLS
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      # Un SMTP que no responde no debe colgar el despachador: falla y se reintenta
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

springdoc:
  api-docs:
    version: openapi_3_0        # K2: oasdiff compara contra OpenAPI 3.0

fitstore:
  eventos:
    servicio: notification      # cola notification.eventos y DLQ notification.eventos.dlq
    # Las 17 routing keys que consume (micro 6 y 10.6); coinciden con los canales del AsyncAPI
    enlaces:
      - auth.cliente.registrado
      - auth.password.reset-solicitado
      - auth.password.cambiado
      - catalog.stock.bajo
      - catalog.stock.no-confirmado
      - order.pedido.creado
      - order.pedido.pagado
      - order.pedido.cancelado
      - order.pedido.listo-recojo
      - order.pedido.recogido
      - payment.boleta.emitida
      - payment.reembolso.completado
      - payment.reembolso.fallido
      - delivery.entrega.actualizada
      - settings.configuracion.actualizada
      - settings.reclamo.registrado
      - settings.reclamo.respondido
  outbox:
    habilitado: false           # notification no publica eventos (micro 6); la tabla outbox_evento existe igual
    intervalo-ms: 1000
    lote: 100
  notificacion:
    remitente: ${MAIL_FROM:}    # dirección verificada en SES
    ritmo-por-segundo: 1
    reintentos: [1m, 5m, 15m, 60m]
    confirmacion-sin-boleta-tras: 10m
    retencion: 180d
    intervalo-despacho: 5s          # el despachador toma ritmo-por-segundo × 5 correos por ciclo
    payment-url: ${PAYMENT_URL:http://payment-service:8084}     # boleta de /internal/v1/boletas (no pasa por el gateway)
    settings-url: ${SETTINGS_URL:http://settings-service:8087}  # solo si arranca sin copia de la marca
    enlaces:
      storefront: ${STOREFRONT_URL}
      backoffice: ${BACKOFFICE_URL}
