# Configuración de order-service (micro order 10.5). Sin secretos: solo ${VARIABLES} de .env.
server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/order_db
    username: ${ORDER_DB_USER}
    password: ${ORDER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # el esquema lo maneja Flyway
  flyway:
    locations: classpath:db/migration
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          catalog-service:  { connect-timeout: 1000, read-timeout: 3000 }
          auth-service:     { connect-timeout: 1000, read-timeout: 2000 }
          delivery-service: { connect-timeout: 1000, read-timeout: 2000 }
          settings-service: { connect-timeout: 1000, read-timeout: 2000 }

resilience4j:
  circuitbreaker:
    configs:
      default: { sliding-window-size: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 20s }
  retry:
    configs:
      default: { max-attempts: 2, wait-duration: 200ms }   # 1 reintento

springdoc:
  api-docs:
    version: openapi_3_0

fitstore:
  eventos:
    servicio: order
    # Cola order.eventos (con DLQ) enlazada a lo que order consume (micro order 10.6)
    enlaces:
      - payment.pago.confirmado
      - payment.pago.rechazado
      - payment.boleta.emitida
      - payment.reembolso.completado
      - delivery.entrega.actualizada
  outbox:
    habilitado: true
  order:
    carrito: { max-lineas: 50, max-unidades-linea: 100, ttl-anonimo: 7d, ttl-cliente: 30d }
    codigo-prefijo: FS
    settings-cache-ttl: 5m
    expirador-cron: "0 * * * * *"
    defaults: { expiracion-pedido-minutos: 30 }   # si settings no responde y no hay caché
