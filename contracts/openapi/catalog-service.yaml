  /internal/v1/inventario/reservas:
    post:
      tags: [interno]
      operationId: reservarStock
      summary: Reservar stock para un pedido (interno, order-service)
      description: |
        Idempotente por `pedidoId` (si ya existe, 200 con la misma reserva); todo o nada en una transacción; vence
        `expiraEnPedido + margenReservaMinutos` (micro 4.6, CA-2-45 a 53). Sin stock → 409 `SIN_STOCK` con `detalles.faltantes[]`.
        No pasa por el gateway: lo llama order con su JWT propagado.
      x-roles: [INTERNO]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaRequest'
      responses:
        '200':
          $ref: '#/components/responses/ReservaCreada'
        '201':
          $ref: '#/components/responses/ReservaCreada'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '409':
          description: Alguna línea no alcanza; no se reservó nada.
          content:
            application/json:
              schema:
                $ref: './comun.yaml#/components/schemas/ApiError'
              example:
                success: false
                mensaje: Sin stock para algunos productos
                codigo: SIN_STOCK
                detalles:
                  faltantes:
                    - varianteId: 230
                      solicitado: 2
                      disponible: 1

components:
  securitySchemes:
    bearerAuth:
      $ref: './comun.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VarianteId:
      name: varianteId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        example: legging-pro-compresion

  responses:
    CategoriaGuardada:
      description: Categoría.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaCategoriaAdmin'
    ProductoGuardado:
      description: Producto completo (con variantes, imágenes y descuento).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaProductoAdmin'
    TallaGuardada:
      description: Talla.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaTalla'
    ColorGuardado:
      description: Color.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaColor'
    PoliticaDescuentosGuardada:
      description: Política global de descuentos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaPoliticaDescuentos'
    ConfiguracionInventarioGuardada:
      description: Configuración de inventario.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaConfiguracionInventario'
    ReservaCreada:
      description: Reserva activa (201 nueva, 200 si ya existía).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaReserva'

  schemas:
    EstadoProducto:
      type: string
      enum: [BORRADOR, ACTIVO, INACTIVO]
    ModoDescuento:
      type: string
      enum: [GLOBAL, PERSONALIZADO, SIN_DESCUENTO]
    Disponibilidad:
      type: string
      enum: [DISPONIBLE, ULTIMAS, AGOTADO]
      description: AGOTADO (0), ULTIMAS (1 a 5, umbral configurable) o DISPONIBLE (más de 5).
    EstadoStock:
      type: string
      enum: [OK, BAJO, AGOTADO]
    TipoMovimiento:
      type: string
      enum: [ENTRADA, AJUSTE, VENTA, REINGRESO]

    Talla:
      type: object
      required: [id, codigo, orden, activo]
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
          maxLength: 10
          example: M
        orden:
          type: integer
        activo:
          type: boolean
    Color:
      type: object
      required: [id, nombre, hex, activo]
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
          maxLength: 40
          example: Negro
        hex:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#111111'
        activo:
          type: boolean
    Tramo:
      type: object
      required: [unidadesMinimas, porcentaje]
      properties:
        unidadesMinimas:
          type: integer
          minimum: 2
          example: 3
        porcentaje:
          type: number
          multipleOf: 0.01
          minimum: 0
          maximum: 50
          example: 5

    CategoriaNodo:
      type: object
      required: [id, nombre, slug, hijas]
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
          example: Leggings y pantalones
        slug:
          type: string
        hijas:
          type: array
          items:
            $ref: '#/components/schemas/CategoriaHija'
    CategoriaHija:
      type: object
      required: [id, nombre, slug]
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
          example: Leggings
        slug:
          type: string

    GuiaTallas:
      type: object
      required: [columnas, filas]
      properties:
        columnas:
          type: array
          minItems: 2
          items:
            type: string
          example: [Talla, Cintura (cm), Cadera (cm), Largo (cm)]
        filas:
          type: array
          items:
            type: array
            items:
              type: string
          example: [[S, '64-68', '90-94', '86'], [M, '68-72', '94-98', '88']]
        nota:
          type: string
          nullable: true
          maxLength: 300

    ProductoTarjeta:
      type: object
      required: [id, slug, nombre, precioDesde, colores, agotado]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        nombre:
          type: string
        imagenUrl:
          type: string
          nullable: true
          description: Miniatura de 400 px de la imagen principal.
        precioDesde:
          $ref: './comun.yaml#/components/schemas/Monto'
        colores:
          type: array
          description: Muestras de los colores con stock.
          items:
            $ref: '#/components/schemas/Color'
        etiquetaDescuento:
          type: string
          nullable: true
          example: Desde 3 un. −5 %
        agotado:
          type: boolean

    ImagenProducto:
      type: object
      required: [id, colorId, url, urlMiniatura, orden, principal]
      properties:
        id:
          type: integer
          format: int64
        colorId:
          type: integer
          format: int64
        url:
          type: string
          description: 1200 px.
        urlMiniatura:
          type: string
          description: 400 px.
        orden:
          type: integer
        principal:
          type: boolean
        ancho:
          type: integer
        alto:
          type: integer

    VariantePublica:
      type: object
      required: [id, sku, tallaId, colorId, precio, disponibilidad]
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
          example: LEG01-NEG-M
        tallaId:
          type: integer
          format: int64
        colorId:
          type: integer
          format: int64
        precio:
          $ref: './comun.yaml#/components/schemas/Monto'
        disponibilidad:
          $ref: '#/components/schemas/Disponibilidad'
        ultimasUnidades:
          type: integer
          nullable: true
          minimum: 1
          description: Solo cuando la disponibilidad es ULTIMAS ("¡Últimas 3 unidades!").
        unidadesComprables:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Stock disponible acotado a las unidades del tramo de descuento más alto del producto (con tramos de 3, 6 y 12
            y 40 en stock se publica 12). Sirve para saber qué tramos alcanza la variante sin exponer el inventario real
            (CA-2-73). Ausente si el producto no tiene tramos.

    ProductoDetalle:
      type: object
      required: [id, slug, nombre, descripcion, precioDesde, categorias, tallas, colores, variantes, imagenes, tramos]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        precioDesde:
          $ref: './comun.yaml#/components/schemas/Monto'
        categorias:
          type: array
          description: Para la ruta de migas y la guía de tallas.
          items:
            $ref: '#/components/schemas/CategoriaHija'
        tallas:
          type: array
          items:
            $ref: '#/components/schemas/Talla'
        colores:
          type: array
          items:
            $ref: '#/components/schemas/ColorDetalle'
        variantes:
          type: array
          items:
            $ref: '#/components/schemas/VariantePublica'
        imagenes:
          type: array
          items:
            $ref: '#/components/schemas/ImagenProducto'
        tramos:
          type: array
          description: Tramos vigentes según el modo de descuento (vacío si no hay).
          items:
            $ref: '#/components/schemas/Tramo'
        tieneGuiaTallas:
          type: boolean

    ColorDetalle:
      allOf:
        - $ref: '#/components/schemas/Color'
        - type: object
          required: [conStock]
          properties:
            conStock:
              type: boolean
              description: false = sin stock en ninguna talla (se muestra tachado y no seleccionable, CA-2-09).

    LineaCotizar:
      type: object
      required: [varianteId, cantidad]
      properties:
        varianteId:
          type: integer
          format: int64
        cantidad:
          type: integer
          minimum: 1
          maximum: 100
    CotizarRequest:
      type: object
      required: [lineas]
      properties:
        lineas:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/LineaCotizar'

    LineaCotizada:
      type: object
      required: [varianteId, cantidad, estado]
      properties:
        varianteId:
          type: integer
          format: int64
        productoId:
          type: integer
          format: int64
          nullable: true
        sku:
          type: string
          nullable: true
        producto:
          type: string
          nullable: true
        slug:
          type: string
          nullable: true
        talla:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        imagenUrl:
          type: string
          nullable: true
        precioUnitario:
          $ref: './comun.yaml#/components/schemas/Monto'
        cantidad:
          type: integer
        subtotal:
          $ref: './comun.yaml#/components/schemas/Monto'
        descuentoPorcentaje:
          type: number
          multipleOf: 0.01
        descuentoMonto:
          $ref: './comun.yaml#/components/schemas/Monto'
        total:
          $ref: './comun.yaml#/components/schemas/Monto'
        estado:
          type: string
          enum: [OK, STOCK_INSUFICIENTE, NO_DISPONIBLE]
          description: NO_DISPONIBLE = variante inactiva o producto no ACTIVO (montos en 0, CA-2-15).
        disponible:
          type: integer
          nullable: true
          minimum: 0
          description: Solo cuando el estado es STOCK_INSUFICIENTE ("Solo quedan 3 unidades").
        unidadesComprables:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Stock disponible acotado a las unidades del tramo de descuento más alto del producto (con tramos de 3, 6 y 12
            y 40 en stock se publica 12; con 8, 8; agotada, 0). Sirve para saber qué tramos alcanza la variante sin
            exponer el inventario real. Si es menor que el tramo más alto, es el stock exacto; si es igual, el stock real
            puede ser mayor. Ausente si el producto no tiene tramos o la línea es NO_DISPONIBLE.

    ProductoCotizado:
      type: object
      required: [productoId, nombre, unidades]
      properties:
        productoId:
          type: integer
          format: int64
        nombre:
          type: string
        unidades:
          type: integer
        tramoAlcanzado:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Tramo'
        siguienteTramo:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SiguienteTramo'
    SiguienteTramo:
      allOf:
        - $ref: '#/components/schemas/Tramo'
        - type: object
          required: [faltan]
          properties:
            faltan:
              type: integer
              minimum: 1
              description: Unidades que faltan ("Agrega 2 más y ahorra 15 %").

    Cotizacion:
      type: object
      required: [lineas, productos, subtotal, descuentoTotal, total]
      properties:
        lineas:
          type: array
          items:
            $ref: '#/components/schemas/LineaCotizada'
        productos:
          type: array
          items:
            $ref: '#/components/schemas/ProductoCotizado'
        subtotal:
          $ref: './comun.yaml#/components/schemas/Monto'
        descuentoTotal:
          $ref: './comun.yaml#/components/schemas/Monto'
        total:
          $ref: './comun.yaml#/components/schemas/Monto'

    CategoriaAdmin:
      type: object
      required: [id, nombre, slug, orden, activo, cantidadProductos, hijas]
      properties:
        id:
          type: integer
          format: int64
        padreId:
          type: integer
          format: int64
          nullable: true
        nombre:
          type: string
        slug:
          type: string
        orden:
          type: integer
        activo:
          type: boolean
        cantidadProductos:
          type: integer
        tieneGuiaTallas:
          type: boolean
        hijas:
          type: array
          items:
            $ref: '#/components/schemas/CategoriaAdminHija'
    CategoriaAdminHija:
      type: object
      required: [id, nombre, slug, orden, activo, cantidadProductos]
      properties:
        id:
          type: integer
          format: int64
        padreId:
          type: integer
          format: int64
        nombre:
          type: string
        slug:
          type: string
        orden:
          type: integer
        activo:
          type: boolean
        cantidadProductos:
          type: integer
        tieneGuiaTallas:
          type: boolean
    CategoriaRequest:
      type: object
      required: [nombre]
      properties:
        padreId:
          type: integer
          format: int64
          nullable: true
          description: null = categoría raíz.
        nombre:
          type: string
          minLength: 2
          maxLength: 60
    OrdenRequest:
      type: object
      required: [orden]
      properties:
        orden:
          type: integer
          minimum: 0

    ProductoAdminResumen:
      type: object
      required: [id, codigo, nombre, slug, estado, destacado, precioDesde, cantidadVariantes, stockDisponible]
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
        nombre:
          type: string
        slug:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoProducto'
        destacado:
          type: boolean
        precioDesde:
          $ref: './comun.yaml#/components/schemas/Monto'
        cantidadVariantes:
          type: integer
        stockDisponible:
          type: integer
        imagenUrl:
          type: string
          nullable: true

    VarianteAdmin:
      type: object
      required: [id, sku, tallaId, talla, colorId, color, activo, fisico, reservado, disponible]
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        tallaId:
          type: integer
          format: int64
        talla:
          type: string
        colorId:
          type: integer
          format: int64
        color:
          type: string
        precio:
          type: number
          multipleOf: 0.01
          minimum: 0
          nullable: true
          description: null = usa el precio base.
        activo:
          type: boolean
        fisico:
          type: integer
        reservado:
          type: integer
        disponible:
          type: integer

    ProductoAdmin:
      type: object
      required: [id, codigo, nombre, slug, descripcion, precioBase, estado, destacado, modoDescuento, categoriaIds, variantes, imagenes, version]
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
        nombre:
          type: string
        slug:
          type: string
        descripcion:
          type: string
        precioBase:
          $ref: './comun.yaml#/components/schemas/Monto'
        estado:
          $ref: '#/components/schemas/EstadoProducto'
        destacado:
          type: boolean
        ordenDestacado:
          type: integer
          nullable: true
        modoDescuento:
          $ref: '#/components/schemas/ModoDescuento'
        tramosPropios:
          type: array
          items:
            $ref: '#/components/schemas/Tramo'
        categoriaIds:
          type: array
          items:
            type: integer
            format: int64
        variantes:
          type: array
          items:
            $ref: '#/components/schemas/VarianteAdmin'
        imagenes:
          type: array
          items:
            $ref: '#/components/schemas/ImagenProducto'
        version:
          type: integer

    ProductoRequest:
      type: object
      required: [codigo, nombre, descripcion, precioBase]
      properties:
        codigo:
          type: string
          pattern: '^[A-Z0-9]{2,20}$'
          description: Base del SKU.
        nombre:
          type: string
          minLength: 3
          maxLength: 120
        descripcion:
          type: string
          maxLength: 5000
        precioBase:
          type: number
          multipleOf: 0.01
          minimum: 0
        categoriaIds:
          type: array
          items:
            type: integer
            format: int64
        version:
          type: integer
          nullable: true
          description: Obligatoria al editar (bloqueo optimista).
    CategoriasProductoRequest:
      type: object
      required: [categoriaIds]
      properties:
        categoriaIds:
          type: array
          items:
            type: integer
            format: int64
    DestacadoRequest:
      type: object
      required: [destacado]
      properties:
        destacado:
          type: boolean
        orden:
          type: integer
          nullable: true
          minimum: 0
    DescuentoProductoRequest:
      type: object
      required: [modo]
      properties:
        modo:
          $ref: '#/components/schemas/ModoDescuento'
        tramos:
          type: array
          maxItems: 10
          description: Obligatorio si el modo es PERSONALIZADO.
          items:
            $ref: '#/components/schemas/Tramo'
    VarianteRequest:
      type: object
      required: [tallaId, colorId]
      properties:
        tallaId:
          type: integer
          format: int64
        colorId:
          type: integer
          format: int64
        sku:
          type: string
          nullable: true
          maxLength: 40
          description: Si no viene, se genera `{CODIGO}-{COL}-{TALLA}` (C2).
        precio:
          type: number
          multipleOf: 0.01
          minimum: 0
          nullable: true
    EditarVarianteRequest:
      type: object
      required: [sku]
      properties:
        sku:
          type: string
          maxLength: 40
        precio:
          type: number
          multipleOf: 0.01
          minimum: 0
          nullable: true
    MatrizRequest:
      type: object
      required: [tallaIds, colorIds]
      properties:
        tallaIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
        colorIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
    SubirImagenProductoRequest:
      type: object
      required: [archivo, colorId]
      properties:
        archivo:
          type: string
          format: binary
        colorId:
          type: integer
          format: int64
        principal:
          type: boolean
    ImagenProductoRequest:
      type: object
      required: [orden, principal, colorId]
      properties:
        orden:
          type: integer
          minimum: 0
        principal:
          type: boolean
        colorId:
          type: integer
          format: int64

    ArchivoCargaRequest:
      type: object
      required: [archivo]
      properties:
        archivo:
          type: string
          format: binary
          description: CSV o XLSX, máximo 5 MB.
    ErrorFila:
      type: object
      required: [fila, mensaje]
      properties:
        fila:
          type: integer
          minimum: 2
        columna:
          type: string
          nullable: true
        mensaje:
          type: string
          example: El color "Morado" no existe
    ValidacionCarga:
      type: object
      required: [validacionId, valida, filas, productos, variantes, errores, expiraEn]
      properties:
        validacionId:
          type: string
          format: uuid
        valida:
          type: boolean
        filas:
          type: integer
        productos:
          type: integer
        variantes:
          type: integer
        errores:
          type: array
          items:
            $ref: '#/components/schemas/ErrorFila'
        expiraEn:
          type: string
          format: date-time
    ProductoCreado:
      type: object
      required: [id, codigo, nombre]
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
        nombre:
          type: string
    ResultadoCarga:
      type: object
      required: [productosCreados, variantesCreadas, entradasStock]
      properties:
        productosCreados:
          type: array
          items:
            $ref: '#/components/schemas/ProductoCreado'
        variantesCreadas:
          type: integer
        entradasStock:
          type: integer

    TallaRequest:
      type: object
      required: [codigo, orden]
      properties:
        codigo:
          type: string
          minLength: 1
          maxLength: 10
        orden:
          type: integer
          minimum: 0
        activo:
          type: boolean
          default: true
    ColorRequest:
      type: object
      required: [nombre, hex]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 40
        hex:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        activo:
          type: boolean
          default: true
    PoliticaDescuentos:
      type: object
      required: [activo, tramos]
      properties:
        activo:
          type: boolean
          description: Interruptor global; apagado = sin descuentos en toda la tienda.
        tramos:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Tramo'

    Stock:
      type: object
      required: [varianteId, sku, productoId, producto, talla, color, fisico, reservado, disponible, minimo, minimoPropio, estado]
      properties:
        varianteId:
          type: integer
          format: int64
        sku:
          type: string
        productoId:
          type: integer
          format: int64
        producto:
          type: string
        talla:
          type: string
        color:
          type: string
        fisico:
          type: integer
          minimum: 0
        reservado:
          type: integer
          minimum: 0
        disponible:
          type: integer
          minimum: 0
        minimo:
          type: integer
          minimum: 0
          description: El efectivo (propio o el por defecto de la tienda).
        minimoPropio:
          type: boolean
        estado:
          $ref: '#/components/schemas/EstadoStock'
    Movimiento:
      type: object
      required: [id, tipo, cantidad, saldoFisico, creadoEn]
      properties:
        id:
          type: integer
          format: int64
        tipo:
          $ref: '#/components/schemas/TipoMovimiento'
        cantidad:
          type: integer
          description: Con signo.
        saldoFisico:
          type: integer
        motivo:
          type: string
          nullable: true
        referencia:
          type: string
          nullable: true
          description: Código de pedido en VENTA y REINGRESO.
        usuarioNombre:
          type: string
          nullable: true
          description: null = sistema.
        creadoEn:
          type: string
          format: date-time
    LineaEntrada:
      type: object
      required: [varianteId, cantidad]
      properties:
        varianteId:
          type: integer
          format: int64
        cantidad:
          type: integer
          minimum: 1
          maximum: 10000
    EntradaRequest:
      type: object
      required: [lineas]
      properties:
        lineas:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/LineaEntrada'
        motivo:
          type: string
          nullable: true
          maxLength: 200
    AjusteRequest:
      type: object
      required: [varianteId, cantidad, motivo]
      properties:
        varianteId:
          type: integer
          format: int64
        cantidad:
          type: integer
          description: Positiva o negativa, distinta de 0.
          not:
            enum: [0]
        motivo:
          type: string
          minLength: 3
          maxLength: 200
    MinimoRequest:
      type: object
      required: [minimo]
      properties:
        minimo:
          type: integer
          nullable: true
          minimum: 0
          maximum: 999
    ConfiguracionInventario:
      type: object
      required: [stockMinimoPorDefecto, margenReservaMinutos]
      properties:
        stockMinimoPorDefecto:
          type: integer
          minimum: 0
          maximum: 999
        margenReservaMinutos:
          type: integer
          minimum: 0
          maximum: 30

    ItemReserva:
      type: object
      required: [varianteId, cantidad]
      properties:
        varianteId:
          type: integer
          format: int64
        cantidad:
          type: integer
          minimum: 1
          maximum: 100
    ReservaRequest:
      type: object
      required: [pedidoId, expiraEnPedido, items]
      properties:
        pedidoId:
          type: string
          format: uuid
        expiraEnPedido:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/ItemReserva'
    Reserva:
      type: object
      required: [pedidoId, estado, expiraEn, items]
      properties:
        pedidoId:
          type: string
          format: uuid
        estado:
          type: string
          enum: [ACTIVA, CONFIRMADA, LIBERADA]
        expiraEn:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemReserva'

    PaginaProductos:
      allOf:
        - $ref: './comun.yaml#/components/schemas/PaginaMeta'
        - type: object
          required: [contenido]
          properties:
            contenido:
              type: array
              items:
                $ref: '#/components/schemas/ProductoTarjeta'
    PaginaProductosAdmin:
