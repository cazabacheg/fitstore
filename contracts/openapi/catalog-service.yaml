openapi: 3.0.3
info:
  title: FitStore — catalog-service
  version: 1.0.0
  description: |
    Catálogo (categorías, productos, variantes, imágenes, maestros, guía de tallas, descuentos por volumen, cotización,
    carga masiva) e inventario (stock, kardex, entradas, ajustes, reservas).

    Fuente: micro `docs/analisis/micro/catalog-service.md` (sección 4) y `docs/specs/SPEC-2-catalogo-inventario.md`.
    Convenciones: `contracts/README.md`. Rol requerido en cada operación: extensión `x-roles`.

    **Privacidad del stock:** las rutas públicas nunca devuelven el stock exacto; usan niveles (`DISPONIBLE`, `ULTIMAS`, `AGOTADO`)
    y el cotizador solo informa cuántas quedan cuando lo pedido no alcanza (micro 4.8).
  license:
    name: Uso académico
servers:
  - url: http://localhost:8080
    description: Gateway en local (docker compose)
  - url: https://{app}.{sub}.duckdns.org
    description: Nube (demo); cada frontend llama a /api en su propio dominio
    variables:
      app:
        enum: [tienda, admin]
        default: tienda
      sub:
        default: fitstore
        description: Subdominio de DuckDNS
tags:
  - name: tienda
    description: Catálogo público (menú, listado, detalle, filtros)
  - name: cotizacion
    description: Precios, descuentos por volumen y disponibilidad para el carrito y el checkout
  - name: categorias-admin
    description: Árbol de categorías y guía de tallas (ADMIN)
  - name: productos-admin
    description: Productos, variantes, imágenes, destacados y carga masiva
  - name: maestros-admin
    description: Tallas, colores y política de descuentos (ADMIN)
  - name: inventario
    description: Stock, kardex, entradas, ajustes y configuración
  - name: interno
    description: Rutas internas entre servicios (el gateway no las expone, K3)

paths:
  /api/v1/categorias:
    get:
      tags: [tienda]
      operationId: obtenerArbolCategorias
      summary: Árbol de categorías activas
      description: Menú de la tienda (2 niveles, en su orden). Caché de 10 min.
      x-roles: [PUBLICO]
      security: []
      responses:
        '200':
          description: Categorías raíz con sus hijas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaArbolCategorias'
        '429':
          $ref: './comun.yaml#/components/responses/DemasiadosIntentos'

  /api/v1/categorias/{slug}/guia-tallas:
    get:
      tags: [tienda]
      operationId: obtenerGuiaTallas
      summary: Guía de tallas de una categoría
      description: La de la categoría o, si no tiene, la de su padre (CA-2-20). Sin guía → 404.
      x-roles: [PUBLICO]
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Guía de tallas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaGuiaTallas'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '429':
          $ref: './comun.yaml#/components/responses/DemasiadosIntentos'

  /api/v1/productos:
    get:
      tags: [tienda]
      operationId: listarProductos
      summary: Listado de productos con búsqueda y filtros
      description: |
        Solo productos ACTIVO con al menos una variante activa; `q` sin importar tildes; `categoria` incluye a sus hijas;
        `talla` y `color` admiten varios valores (micro 4.3, CA-2-01 a 07). `size` máximo 48, por defecto 24.
      x-roles: [PUBLICO]
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 80
        - name: categoria
          in: query
          description: Slug de la categoría.
          schema:
            type: string
        - name: talla
          in: query
          description: Código de talla; se puede repetir.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: color
          in: query
          description: Id de color; se puede repetir.
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: true
        - name: precioMin
          in: query
          schema:
            $ref: './comun.yaml#/components/schemas/Monto'
        - name: precioMax
          in: query
          schema:
            $ref: './comun.yaml#/components/schemas/Monto'
        - name: disponible
          in: query
          description: true = solo con stock disponible.
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 24
        - name: sort
          in: query
          schema:
            type: string
            enum: [novedad, 'precio,asc', 'precio,desc', nombre]
            default: novedad
      responses:
        '200':
          description: Página de productos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPaginaProductos'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '429':
          $ref: './comun.yaml#/components/responses/DemasiadosIntentos'

  /api/v1/productos/destacados:
    get:
      tags: [tienda]
      operationId: listarDestacados
      summary: Destacados de la landing
      description: Máximo 8, en su orden (SPEC-3 CA-3-04).
      x-roles: [PUBLICO]
      security: []
      responses:
        '200':
          description: Tarjetas de los destacados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaListaTarjetas'
        '429':
          $ref: './comun.yaml#/components/responses/DemasiadosIntentos'

  /api/v1/productos/{slug}:
    get:
      tags: [tienda]
      operationId: obtenerProducto
      summary: Detalle de un producto
      description: Variantes con su nivel de disponibilidad, imágenes por color, tramos de descuento y categorías (CA-2-08 a 12). Un producto no ACTIVO → 404.
      x-roles: [PUBLICO]
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Detalle del producto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaProductoDetalle'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '429':
          $ref: './comun.yaml#/components/responses/DemasiadosIntentos'

  /api/v1/tallas:
    get:
      tags: [tienda]
      operationId: listarTallas
      summary: Tallas activas (para filtros)
      x-roles: [PUBLICO]
      security: []
      responses:
        '200':
          description: Tallas en su orden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaTallas'
        '429':
          $ref: './comun.yaml#/components/responses/DemasiadosIntentos'

  /api/v1/colores:
    get:
      tags: [tienda]
      operationId: listarColores
      summary: Colores activos (para filtros)
      x-roles: [PUBLICO]
      security: []
      responses:
        '200':
          description: Colores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaColores'
        '429':
          $ref: './comun.yaml#/components/responses/DemasiadosIntentos'

  /api/v1/precios/cotizar:
    post:
      tags: [cotizacion]
      operationId: cotizarLineas
      summary: Cotizar líneas de carrito
      description: |
        Precio vigente, descuento por volumen (agrupado por producto, tramo más alto, half-up por línea), estado de cada línea
        y cuánto falta para el siguiente tramo (micro 4.5, CA-2-13 a 16). Lo llaman order (carrito, resumen y checkout) y el frontend.
        Más de 50 líneas → 400.
      x-roles: [PUBLICO]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CotizarRequest'
            example:
              lineas:
                - varianteId: 101
                  cantidad: 4
                - varianteId: 102
                  cantidad: 2
                - varianteId: 230
                  cantidad: 1
      responses:
        '200':
          description: Cotización.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaCotizacion'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '429':
          $ref: './comun.yaml#/components/responses/DemasiadosIntentos'

  /api/v1/admin/categorias:
    get:
      tags: [categorias-admin]
      operationId: listarCategoriasAdmin
      summary: Todas las categorías (activas e inactivas)
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Árbol completo con conteo de productos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaCategoriasAdmin'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
    post:
      tags: [categorias-admin]
      operationId: crearCategoria
      summary: Crear una categoría raíz o hija
      description: Máximo 2 niveles; nombre único entre hermanas; slug generado (CA-2-17).
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
      responses:
        '201':
          $ref: '#/components/responses/CategoriaGuardada'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'

  /api/v1/admin/categorias/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [categorias-admin]
      operationId: editarCategoria
      summary: Editar una categoría
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
      responses:
        '200':
          $ref: '#/components/responses/CategoriaGuardada'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'
    delete:
      tags: [categorias-admin]
      operationId: eliminarCategoria
      summary: Eliminar una categoría
      description: Con hijas o productos → 409 `CATEGORIA_EN_USO` y se sugiere desactivarla (CA-2-19).
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: './comun.yaml#/components/responses/Ok'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'

  /api/v1/admin/categorias/{id}/desactivar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [categorias-admin]
      operationId: desactivarCategoria
      summary: Desactivar una categoría
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/CategoriaGuardada'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

  /api/v1/admin/categorias/{id}/activar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [categorias-admin]
      operationId: activarCategoria
      summary: Activar una categoría
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/CategoriaGuardada'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

  /api/v1/admin/categorias/{id}/orden:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [categorias-admin]
      operationId: ordenarCategoria
      summary: Mover una categoría (arrastrar)
      description: Nueva posición entre sus hermanas; invalida la caché del menú (CA-2-18).
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenRequest'
      responses:
        '200':
          description: Árbol actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaCategoriasAdmin'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

  /api/v1/admin/categorias/{id}/guia-tallas:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [categorias-admin]
      operationId: guardarGuiaTallas
      summary: Guardar la guía de tallas
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuiaTallas'
      responses:
        '200':
          description: Guía guardada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaGuiaTallas'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

  /api/v1/admin/productos:
    get:
      tags: [productos-admin]
      operationId: listarProductosAdmin
      summary: Productos en todos los estados
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Nombre o código.
          schema:
            type: string
            maxLength: 80
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoProducto'
        - name: categoriaId
          in: query
          schema:
            type: integer
            format: int64
        - name: destacado
          in: query
          schema:
            type: boolean
        - $ref: './comun.yaml#/components/parameters/page'
        - $ref: './comun.yaml#/components/parameters/size'
        - $ref: './comun.yaml#/components/parameters/sort'
      responses:
        '200':
          description: Página de productos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPaginaProductosAdmin'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
    post:
      tags: [productos-admin]
      operationId: crearProducto
      summary: Crear un producto en BORRADOR
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoRequest'
            example:
              codigo: LEG01
              nombre: Legging Pro Compresión
              descripcion: Tela de compresión, tiro alto, secado rápido.
              precioBase: 59.9
              categoriaIds: [12]
      responses:
        '201':
          $ref: '#/components/responses/ProductoGuardado'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'

  /api/v1/admin/productos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [productos-admin]
      operationId: obtenerProductoAdmin
      summary: Producto completo (formulario)
      description: El OPERADOR lo ve en solo lectura (SPEC-2 P-2-04).
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ProductoGuardado'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
    put:
      tags: [productos-admin]
      operationId: editarProducto
      summary: Editar los datos del producto
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProductoGuardado'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'
    delete:
      tags: [productos-admin]
      operationId: eliminarProducto
      summary: Eliminar un producto
      description: Solo BORRADOR sin movimientos; si no → 409 y se usa desactivar (CA-2-26).
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: './comun.yaml#/components/responses/Ok'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'

  /api/v1/admin/productos/{id}/publicar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [productos-admin]
      operationId: publicarProducto
      summary: Publicar (ACTIVO)
      description: |
        Exige categoría, precio > 0, al menos una variante activa e imagen por cada color activo (invariante 4, CA-2-24, 25).
        Si falta algo → 409 `NO_PUBLICABLE` con `detalles.faltantes[]`.
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ProductoGuardado'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          description: No cumple las condiciones para publicarse.
          content:
            application/json:
              schema:
                $ref: './comun.yaml#/components/schemas/ApiError'
              example:
                success: false
                mensaje: Falta completar el producto para publicarlo
                codigo: NO_PUBLICABLE
                detalles:
                  faltantes: ['Imagen del color Rojo']

  /api/v1/admin/productos/{id}/desactivar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [productos-admin]
      operationId: desactivarProducto
      summary: Desactivar (INACTIVO)
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/ProductoGuardado'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

  /api/v1/admin/productos/{id}/categorias:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [productos-admin]
      operationId: asignarCategoriasProducto
      summary: Reemplazar las categorías asignadas
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriasProductoRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProductoGuardado'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

  /api/v1/admin/productos/{id}/destacado:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [productos-admin]
      operationId: marcarDestacado
      summary: Marcar o desmarcar como destacado
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestacadoRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProductoGuardado'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

  /api/v1/admin/productos/{id}/descuento:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [productos-admin]
      operationId: configurarDescuentoProducto
      summary: Modo de descuento y tramos propios
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescuentoProductoRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProductoGuardado'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

  /api/v1/admin/productos/{id}/variantes:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [productos-admin]
      operationId: crearVariante
      summary: Crear una variante
      description: SKU `{CODIGO}-{COL}-{TALLA}` sugerido y editable (C2); combinación talla × color única.
