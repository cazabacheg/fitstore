openapi: 3.0.3
info:
  title: FitStore — delivery-service
  version: 1.0.0
  description: |
    Tarifas por ubigeo con búsqueda jerárquica, opciones y cotización de envío, agencias, repartidores, entregas locales y por
    agencia (con devolución a tienda), entregas del día con hoja de ruta y resumen para el dashboard.

    Fuente: micro `docs/analisis/micro/delivery-service.md` (sección 4) y `docs/specs/SPEC-6-envios.md`.
    Convenciones: `contracts/README.md`. Rol requerido en cada operación: extensión `x-roles`.
  license:
    name: Uso académico
servers:
  - url: http://localhost:8080
    description: Gateway en local (docker compose)
  - url: https://{app}.{sub}.duckdns.org
    description: Nube (demo); cada frontend llama a /api en su propio dominio
    variables:
      app:
        enum: [tienda, admin]
        default: tienda
      sub:
        default: fitstore
        description: Subdominio de DuckDNS
tags:
  - name: envios
    description: Opciones, cotización y agencias para el checkout (públicos)
  - name: entregas
    description: Entregas locales y por agencia en el backoffice
  - name: repartidores
    description: Repartidores de la tienda
  - name: tarifas
    description: Tarifas de envío por ubigeo (ADMIN)
  - name: agencias-admin
    description: Agencias de transporte (ADMIN)

paths:
  /api/v1/envios/opciones:
    get:
      tags: [envios]
      operationId: obtenerOpcionesEnvio
      summary: Modalidades con tarifa para un distrito
      description: Delivery local y/o agencia con costo y plazo; el recojo lo agrega el checkout (CA-6-06). Distrito obligatorio (6 dígitos).
      x-roles: [PUBLICO]
      security: []
      parameters:
        - name: ubigeo
          in: query
          required: true
          schema:
            $ref: './comun.yaml#/components/schemas/Ubigeo'
      responses:
        '200':
          description: Opciones disponibles (puede ser vacía).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaOpcionesEnvio'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '429':
          $ref: './comun.yaml#/components/responses/DemasiadosIntentos'

  /api/v1/envios/cotizar:
    post:
      tags: [envios]
      operationId: cotizarEnvio
      summary: Cotizar un envío
      description: |
        Busca la tarifa del distrito, luego la de la provincia y luego la del departamento (micro 4.2, CA-6-01 a 05).
        Sin 6 dígitos → 400; delivery local fuera de Lima y Callao o agencia inactiva → 400; sin tarifa → 422 `SIN_COBERTURA`.
        Lo usan order (resumen y confirmación) y la prueba de tarifas del backoffice (E3).
      x-roles: [PUBLICO]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CotizarEnvioRequest'
            example:
              modalidad: AGENCIA
              ubigeo: '040101'
              agenciaId: 1
      responses:
        '200':
          description: Cotización.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaCotizacionEnvio'
              example:
                success: true
                mensaje: Operación exitosa
                data:
                  costo: 18
                  plazoDiasMin: 2
                  plazoDiasMax: 3
                  agenciaNombre: Shalom
                  nivelTarifa: DEPARTAMENTO
                  ubigeoTarifa: '04'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '422':
          description: No hay tarifa para ese destino y modalidad.
          content:
            application/json:
              schema:
                $ref: './comun.yaml#/components/schemas/ApiError'
              example:
                success: false
                mensaje: No realizamos envíos por esta modalidad a este distrito
                codigo: SIN_COBERTURA
        '429':
          $ref: './comun.yaml#/components/responses/DemasiadosIntentos'

  /api/v1/agencias:
    get:
      tags: [envios]
      operationId: listarAgenciasActivas
      summary: Agencias activas (para el checkout)
      x-roles: [PUBLICO]
      security: []
      responses:
        '200':
          description: Agencias activas en su orden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAgencias'
        '429':
          $ref: './comun.yaml#/components/responses/DemasiadosIntentos'

  /api/v1/admin/entregas:
    get:
      tags: [entregas]
      operationId: listarEntregas
      summary: Entregas con filtros
      description: Las pendientes primero; `contadores` por estado para las pestañas (CA-6-31, 32).
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      parameters:
        - name: modalidad
          in: query
          schema:
            $ref: '#/components/schemas/ModalidadEntrega'
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoEntrega'
        - name: fecha
          in: query
          description: Fecha programada.
          schema:
            type: string
            format: date
        - name: repartidorId
          in: query
          schema:
            type: integer
            format: int64
        - name: codigo
          in: query
          description: Código de pedido.
          schema:
            type: string
        - $ref: './comun.yaml#/components/parameters/page'
        - $ref: './comun.yaml#/components/parameters/size'
        - $ref: './comun.yaml#/components/parameters/sort'
      responses:
        '200':
          description: Página de entregas con contadores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPaginaEntregas'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'

  /api/v1/admin/entregas/dia:
    get:
      tags: [entregas]
      operationId: obtenerEntregasDia
      summary: Entregas del día y hoja de ruta
      description: Por repartidor (ordenadas por distrito) y las sin asignar de esa fecha (CA-6-28, 29).
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      parameters:
        - name: fecha
          in: query
          description: Por defecto, hoy (America/Lima).
          schema:
            type: string
            format: date
        - name: repartidorId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Entregas del día.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEntregasDia'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'

  /api/v1/admin/entregas/resumen:
    get:
      tags: [entregas]
      operationId: obtenerResumenEntregas
      summary: Entregas de un día por estado (dashboard)
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      parameters:
        - name: fecha
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Contadores por estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaResumenEntregas'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'

  /api/v1/admin/entregas/{id}:
    parameters:
      - $ref: '#/components/parameters/EntregaId'
    get:
      tags: [entregas]
      operationId: obtenerEntrega
      summary: Detalle de una entrega
      description: Con `accionesPermitidas` (E5), seguimiento y `version` (E6).
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/EntregaActual'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

  /api/v1/admin/entregas/{id}/asignar:
    parameters:
      - $ref: '#/components/parameters/EntregaId'
    patch:
      tags: [entregas]
      operationId: asignarEntrega
      summary: Asignar o reprogramar
      description: Repartidor activo y fecha de hoy o posterior; también reprograma desde ASIGNADA o FALLIDA (nuevo intento) (CA-6-20, 22).
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarRequest'
      responses:
        '200':
          $ref: '#/components/responses/EntregaActual'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'

  /api/v1/admin/entregas/{id}/en-ruta:
    parameters:
      - $ref: '#/components/parameters/EntregaId'
    patch:
      tags: [entregas]
      operationId: marcarEnRuta
      summary: Sale a repartir
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          $ref: '#/components/responses/EntregaActual'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'

  /api/v1/admin/entregas/{id}/entregada:
    parameters:
      - $ref: '#/components/parameters/EntregaId'
    patch:
      tags: [entregas]
      operationId: marcarEntregada
      summary: Entregada (local) o recogida en la agencia
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          $ref: '#/components/responses/EntregaActual'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'

  /api/v1/admin/entregas/{id}/fallida:
    parameters:
      - $ref: '#/components/parameters/EntregaId'
    patch:
      tags: [entregas]
      operationId: marcarFallida
      summary: No se pudo entregar
      description: Observación obligatoria; suma un intento (CA-6-22).
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservacionRequest'
      responses:
        '200':
          $ref: '#/components/responses/EntregaActual'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'

  /api/v1/admin/entregas/{id}/enviada-agencia:
    parameters:
      - $ref: '#/components/parameters/EntregaId'
    patch:
      tags: [entregas]
      operationId: registrarEnvioAgencia
      summary: Registrar el envío por agencia
      description: Código de seguimiento obligatorio, clave de recojo opcional; se puede cambiar a otra agencia activa (CA-6-26).
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvioAgenciaRequest'
      responses:
        '200':
          $ref: '#/components/responses/EntregaActual'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'

  /api/v1/admin/entregas/{id}/disponible-agencia:
    parameters:
      - $ref: '#/components/parameters/EntregaId'
    patch:
      tags: [entregas]
      operationId: marcarDisponibleAgencia
      summary: Llegó a la agencia de destino
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          $ref: '#/components/responses/EntregaActual'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'

  /api/v1/admin/entregas/{id}/devuelta:
    parameters:
      - $ref: '#/components/parameters/EntregaId'
    patch:
      tags: [entregas]
      operationId: marcarDevuelta
      summary: Devuelto a tienda
      description: Solo desde FALLIDA o DISPONIBLE_EN_AGENCIA, con motivo obligatorio; estado final (D5, CA-6-33, 34).
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevueltaRequest'
      responses:
        '200':
          $ref: '#/components/responses/EntregaActual'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'

  /api/v1/admin/repartidores:
    get:
      tags: [repartidores]
      operationId: listarRepartidores
      summary: Repartidores
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      parameters:
        - name: activo
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Repartidores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaRepartidores'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
    post:
      tags: [repartidores]
      operationId: crearRepartidor
      summary: Registrar un repartidor
      description: Celular de 9 dígitos que empieza con 9; placa obligatoria en moto y auto (CA-6-16).
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepartidorRequest'
      responses:
        '201':
          $ref: '#/components/responses/RepartidorActual'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'

  /api/v1/admin/repartidores/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [repartidores]
      operationId: editarRepartidor
      summary: Editar un repartidor
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepartidorRequest'
      responses:
        '200':
          $ref: '#/components/responses/RepartidorActual'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
    delete:
      tags: [repartidores]
      operationId: eliminarRepartidor
      summary: Eliminar un repartidor
      description: Con entregas → 409 y se sugiere desactivarlo (CA-6-18).
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: './comun.yaml#/components/responses/Ok'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'

  /api/v1/admin/repartidores/{id}/desactivar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [repartidores]
      operationId: desactivarRepartidor
      summary: Desactivar un repartidor
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/RepartidorActual'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

  /api/v1/admin/repartidores/{id}/activar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [repartidores]
      operationId: activarRepartidor
      summary: Activar un repartidor
      x-roles: [OPERADOR, ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/RepartidorActual'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

  /api/v1/admin/tarifas:
    get:
      tags: [tarifas]
      operationId: listarTarifas
      summary: Tarifas de envío
      description: Los nombres de los destinos los resuelve el frontend con las listas de ubigeo (SPEC-6 P-6-05).
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      parameters:
        - name: modalidad
          in: query
          schema:
            $ref: '#/components/schemas/ModalidadEntrega'
        - name: nivel
          in: query
          schema:
            $ref: '#/components/schemas/NivelTarifa'
      responses:
        '200':
          description: Tarifas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaTarifas'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
    post:
      tags: [tarifas]
      operationId: crearTarifa
      summary: Crear una tarifa
      description: Código de 2, 4 o 6 dígitos según el nivel; (modalidad, ubigeo) único → 409; delivery local solo Lima y Callao (CA-6-07 a 09).
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TarifaRequest'
      responses:
        '201':
          $ref: '#/components/responses/TarifaActual'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'

  /api/v1/admin/tarifas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [tarifas]
      operationId: editarTarifa
      summary: Editar una tarifa (costo, plazo, activa)
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TarifaRequest'
      responses:
        '200':
          $ref: '#/components/responses/TarifaActual'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'
    delete:
      tags: [tarifas]
      operationId: eliminarTarifa
      summary: Eliminar una tarifa
      description: DELETE físico; los pedidos guardan su costo (CA-6-10).
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: './comun.yaml#/components/responses/Ok'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

  /api/v1/admin/agencias:
    get:
      tags: [agencias-admin]
      operationId: listarAgenciasAdmin
      summary: Todas las agencias
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Agencias en su orden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAgencias'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: './comun.yaml#/components/responses/SinPermiso'
    post:
      tags: [agencias-admin]
      operationId: crearAgencia
      summary: Crear una agencia
      description: Nombre único; URL de seguimiento opcional, https y con {codigo} (CA-6-13).
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgenciaRequest'
      responses:
        '201':
          $ref: '#/components/responses/AgenciaActual'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'

  /api/v1/admin/agencias/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [agencias-admin]
      operationId: editarAgencia
      summary: Editar una agencia
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgenciaRequest'
      responses:
        '200':
          $ref: '#/components/responses/AgenciaActual'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'
    delete:
      tags: [agencias-admin]
      operationId: eliminarAgencia
      summary: Eliminar una agencia
      description: Con entregas → 409 y se sugiere desactivarla (CA-6-15).
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: './comun.yaml#/components/responses/Ok'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'
        '409':
          $ref: './comun.yaml#/components/responses/Conflicto'

  /api/v1/admin/agencias/{id}/desactivar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [agencias-admin]
      operationId: desactivarAgencia
      summary: Desactivar una agencia
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/AgenciaActual'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

  /api/v1/admin/agencias/{id}/activar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [agencias-admin]
      operationId: activarAgencia
      summary: Activar una agencia
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/AgenciaActual'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

  /api/v1/admin/agencias/{id}/orden:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [agencias-admin]
      operationId: ordenarAgencia
      summary: Mover una agencia (arrastrar)
      description: Orden en que el checkout muestra las agencias (CA-6-14).
      x-roles: [ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenRequest'
      responses:
        '200':
          description: Agencias reordenadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAgencias'
        '400':
          $ref: './comun.yaml#/components/responses/ErrorValidacion'
        '401':
          $ref: './comun.yaml#/components/responses/NoAutenticado'
        '404':
          $ref: './comun.yaml#/components/responses/NoEncontrado'

components:
  securitySchemes:
    bearerAuth:
      $ref: './comun.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    EntregaId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    EntregaActual:
      description: Entrega con su seguimiento.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaEntrega'
    RepartidorActual:
      description: Repartidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaRepartidor'
    TarifaActual:
      description: Tarifa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaTarifa'
    AgenciaActual:
      description: Agencia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaAgencia'

  schemas:
    ModalidadEntrega:
      type: string
      enum: [DELIVERY_LOCAL, AGENCIA]
    EstadoEntrega:
      type: string
      enum: [PENDIENTE_ASIGNACION, ASIGNADA, EN_RUTA, FALLIDA, PENDIENTE_ENVIO, ENVIADO_AGENCIA, DISPONIBLE_EN_AGENCIA, ENTREGADA, DEVUELTA]
    NivelTarifa:
      type: string
      enum: [DEPARTAMENTO, PROVINCIA, DISTRITO]
    Vehiculo:
      type: string
      enum: [MOTO, AUTO, BICICLETA]
    AccionEntrega:
      type: string
      enum: [ASIGNAR, EN_RUTA, ENTREGADA, FALLIDA, REPROGRAMAR, ENVIADA_AGENCIA, DISPONIBLE_AGENCIA, DEVUELTA]
    UbigeoTarifa:
      type: string
      pattern: '^([0-9]{2}|[0-9]{4}|[0-9]{6})$'
      description: 2 dígitos = departamento, 4 = provincia, 6 = distrito (D1).

    OpcionEnvio:
      type: object
      required: [modalidad, costo, plazoDiasMin, plazoDiasMax]
      properties:
        modalidad:
          $ref: '#/components/schemas/ModalidadEntrega'
        costo:
          $ref: './comun.yaml#/components/schemas/Monto'
        plazoDiasMin:
          type: integer
        plazoDiasMax:
          type: integer

    CotizarEnvioRequest:
      type: object
      required: [modalidad, ubigeo]
      properties:
        modalidad:
          $ref: '#/components/schemas/ModalidadEntrega'
        ubigeo:
          $ref: './comun.yaml#/components/schemas/Ubigeo'
        agenciaId:
          type: integer
          format: int64
          nullable: true
          description: Obligatoria en AGENCIA.

    CotizacionEnvio:
      type: object
      required: [costo, plazoDiasMin, plazoDiasMax, nivelTarifa, ubigeoTarifa]
      properties:
        costo:
          $ref: './comun.yaml#/components/schemas/Monto'
        plazoDiasMin:
          type: integer
        plazoDiasMax:
          type: integer
        agenciaNombre:
          type: string
          nullable: true
        nivelTarifa:
          $ref: '#/components/schemas/NivelTarifa'
        ubigeoTarifa:
          $ref: '#/components/schemas/UbigeoTarifa'

    Agencia:
      type: object
      required: [id, nombre, activa, orden]
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
          example: Shalom
        urlSeguimiento:
          type: string
          nullable: true
          example: 'https://rastreo.shalom.pe/?codigo={codigo}'
        activa:
          type: boolean
        orden:
          type: integer
    AgenciaRequest:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 60
        urlSeguimiento:
          type: string
          nullable: true
          maxLength: 300
          pattern: '^https://.*\{codigo\}.*$'
    OrdenRequest:
      type: object
      required: [orden]
      properties:
        orden:
          type: integer
          minimum: 0

    Repartidor:
      type: object
      required: [id, nombres, telefono, vehiculo, activo, tieneEntregas]
      properties:
        id:
          type: integer
          format: int64
        nombres:
          type: string
        telefono:
          $ref: './comun.yaml#/components/schemas/Celular'
        vehiculo:
          $ref: '#/components/schemas/Vehiculo'
        placa:
          type: string
          nullable: true
        activo:
          type: boolean
        tieneEntregas:
          type: boolean
          description: false = se puede eliminar.
    RepartidorRequest:
      type: object
      required: [nombres, telefono, vehiculo]
      properties:
        nombres:
          type: string
          minLength: 3
          maxLength: 120
        telefono:
          $ref: './comun.yaml#/components/schemas/Celular'
        vehiculo:
          $ref: '#/components/schemas/Vehiculo'
        placa:
          type: string
          nullable: true
          pattern: '^[A-Z0-9]{3}-?[A-Z0-9]{3}$'
          description: Obligatoria en MOTO y AUTO.

    Tarifa:
      type: object
      required: [id, modalidad, ubigeo, nivel, costo, plazoDiasMin, plazoDiasMax, activa]
      properties:
        id:
          type: integer
          format: int64
        modalidad:
          $ref: '#/components/schemas/ModalidadEntrega'
        ubigeo:
          $ref: '#/components/schemas/UbigeoTarifa'
        nivel:
          $ref: '#/components/schemas/NivelTarifa'
        costo:
          $ref: './comun.yaml#/components/schemas/Monto'
        plazoDiasMin:
          type: integer
          minimum: 0
        plazoDiasMax:
          type: integer
          minimum: 0
        activa:
          type: boolean
    TarifaRequest:
      type: object
      required: [modalidad, ubigeo, costo, plazoDiasMin, plazoDiasMax]
      properties:
        modalidad:
          $ref: '#/components/schemas/ModalidadEntrega'
        ubigeo:
          $ref: '#/components/schemas/UbigeoTarifa'
        costo:
          type: number
          multipleOf: 0.01
          minimum: 0
        plazoDiasMin:
          type: integer
          minimum: 0
          maximum: 30
        plazoDiasMax:
          type: integer
          minimum: 0
          maximum: 30
        activa:
          type: boolean
          default: true

    DestinatarioEntrega:
      type: object
      required: [nombres, apellidos, dni, telefono]
      properties:
        nombres:
          type: string
        apellidos:
          type: string
        dni:
          $ref: './comun.yaml#/components/schemas/Dni'
        telefono:
          type: string
    DireccionEntrega:
      type: object
      nullable: true
      required: [ubigeo, departamento, provincia, distrito, direccion]
      properties:
        ubigeo:
          $ref: './comun.yaml#/components/schemas/Ubigeo'
        departamento:
          type: string
        provincia:
          type: string
        distrito:
          type: string
        direccion:
          type: string
        referencia:
          type: string
          nullable: true
    EventoSeguimiento:
      type: object
      required: [estado, fecha, intento]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoEntrega'
        observacion:
          type: string
          nullable: true
        actorNombre:
          type: string
          nullable: true
          description: null = sistema.
        intento:
          type: integer
        fecha:
          type: string
          format: date-time
    RepartidorAsignado:
      type: object
      nullable: true
      required: [id, nombres]
      properties:
        id:
          type: integer
          format: int64
        nombres:
          type: string
        vehiculo:
          $ref: '#/components/schemas/Vehiculo'
        placa:
          type: string
          nullable: true

    EntregaResumen:
      type: object
      required: [id, pedidoId, codigoPedido, modalidad, estado, destinatarioNombre, intento]
      properties:
        id:
          type: string
          format: uuid
        pedidoId:
          type: string
          format: uuid
        codigoPedido:
          type: string
        modalidad:
          $ref: '#/components/schemas/ModalidadEntrega'
        estado:
          $ref: '#/components/schemas/EstadoEntrega'
        destinatarioNombre:
          type: string
        distrito:
          type: string
          nullable: true
        fechaProgramada:
          type: string
          format: date
          nullable: true
        repartidorNombre:
          type: string
          nullable: true
        agenciaNombre:
          type: string
          nullable: true
        intento:
          type: integer
        siguienteAccion:
          type: string
          nullable: true
          description: El siguiente paso para el botón de la fila (E1); null en estados finales.
          enum: [ASIGNAR, EN_RUTA, ENTREGADA, REPROGRAMAR, ENVIADA_AGENCIA, DISPONIBLE_AGENCIA, null]

    Entrega:
      allOf:
        - $ref: '#/components/schemas/EntregaResumen'
        - type: object
          required: [destinatario, resumenItems, eventos, accionesPermitidas, version]
          properties:
            destinatario:
              $ref: '#/components/schemas/DestinatarioEntrega'
            direccion:
              $ref: '#/components/schemas/DireccionEntrega'
            resumenItems:
              type: string
              example: Legging Pro Compresión M Negro × 2 · Top Flex S Blanco × 1
            bultos:
              type: integer
              minimum: 1
            repartidor:
              $ref: '#/components/schemas/RepartidorAsignado'
            agenciaId:
              type: integer
              format: int64
              nullable: true
            codigoSeguimiento:
              type: string
              nullable: true
            claveRecojo:
              type: string
              nullable: true
            urlSeguimiento:
              type: string
              nullable: true
            eventos:
              type: array
              items:
                $ref: '#/components/schemas/EventoSeguimiento'
            accionesPermitidas:
              type: array
              items:
                $ref: '#/components/schemas/AccionEntrega'
            version:
              type: integer

    ItemHojaRuta:
      type: object
      required: [id, codigoPedido, estado, destinatarioNombre, telefono, direccion, distrito, bultos, intento]
      properties:
        id:
          type: string
          format: uuid
        codigoPedido:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoEntrega'
        destinatarioNombre:
          type: string
        telefono:
          type: string
        direccion:
          type: string
        distrito:
          type: string
        referencia:
          type: string
          nullable: true
        bultos:
          type: integer
        intento:
          type: integer
    RutaRepartidor:
      type: object
      required: [repartidor, entregas]
      properties:
        repartidor:
          $ref: '#/components/schemas/RepartidorAsignado'
        entregas:
          type: array
          description: Ordenadas por distrito (CA-6-29).
          items:
            $ref: '#/components/schemas/ItemHojaRuta'
    EntregasDia:
      type: object
      required: [fecha, rutas, sinAsignar]
      properties:
        fecha:
          type: string
          format: date
        rutas:
          type: array
          items:
            $ref: '#/components/schemas/RutaRepartidor'
        sinAsignar:
          type: array
          items:
            $ref: '#/components/schemas/ItemHojaRuta'
    ResumenEntregas:
      type: object
      required: [fecha, porEstado]
      properties:
        fecha:
          type: string
          format: date
        porEstado:
          $ref: './comun.yaml#/components/schemas/Contadores'

    VersionRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
    AsignarRequest:
      type: object
      required: [repartidorId, fechaProgramada, version]
      properties:
        repartidorId:
          type: integer
          format: int64
        fechaProgramada:
          type: string
          format: date
          description: Hoy o posterior (E7).
        version:
          type: integer
    ObservacionRequest:
      type: object
      required: [observacion, version]
      properties:
        observacion:
          type: string
          minLength: 3
          maxLength: 300
        version:
          type: integer
    EnvioAgenciaRequest:
      type: object
      required: [codigoSeguimiento, version]
      properties:
        agenciaId:
          type: integer
          format: int64
          nullable: true
          description: Solo si se cambia la agencia elegida por el cliente.
        codigoSeguimiento:
          type: string
          minLength: 3
          maxLength: 60
        claveRecojo:
          type: string
          nullable: true
          maxLength: 30
        version:
          type: integer
    DevueltaRequest:
      type: object
      required: [motivo, version]
      properties:
        motivo:
          type: string
          minLength: 3
          maxLength: 300
          example: Cliente no ubicable tras 3 intentos
        version:
          type: integer

    PaginaEntregas:
      allOf:
        - $ref: './comun.yaml#/components/schemas/PaginaMeta'
        - type: object
          required: [contenido, contadores]
          properties:
            contenido:
              type: array
              items:
                $ref: '#/components/schemas/EntregaResumen'
            contadores:
              $ref: './comun.yaml#/components/schemas/Contadores'

    # Respuestas envueltas (K4)
    RespuestaOpcionesEnvio:
      allOf:
        - $ref: './comun.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/OpcionEnvio'
    RespuestaCotizacionEnvio:
      allOf:
        - $ref: './comun.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CotizacionEnvio'
    RespuestaAgencias:
      allOf:
        - $ref: './comun.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Agencia'
    RespuestaAgencia:
      allOf:
        - $ref: './comun.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Agencia'
    RespuestaPaginaEntregas:
      allOf:
        - $ref: './comun.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PaginaEntregas'
    RespuestaEntrega:
      allOf:
        - $ref: './comun.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Entrega'
    RespuestaEntregasDia:
      allOf:
        - $ref: './comun.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EntregasDia'
    RespuestaResumenEntregas:
      allOf:
        - $ref: './comun.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ResumenEntregas'
    RespuestaRepartidores:
      allOf:
        - $ref: './comun.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Repartidor'
    RespuestaRepartidor:
      allOf:
        - $ref: './comun.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Repartidor'
    RespuestaTarifas:
      allOf:
        - $ref: './comun.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Tarifa'
    RespuestaTarifa:
      allOf:
        - $ref: './comun.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Tarifa'
