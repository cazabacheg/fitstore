operations:
  # --- Publicadores (send) ---
  authPublicaClienteRegistrado:
    action: send
    channel:
      $ref: '#/channels/clienteRegistrado'
    summary: auth publica al registrarse un cliente.
  authPublicaPasswordResetSolicitado:
    action: send
    channel:
      $ref: '#/channels/passwordResetSolicitado'
    summary: auth publica al pedir recuperación o invitar a un staff.
  authPublicaPasswordCambiado:
    action: send
    channel:
      $ref: '#/channels/passwordCambiado'
    summary: auth publica al cambiar o restablecer una contraseña.
  catalogPublicaStockBajo:
    action: send
    channel:
      $ref: '#/channels/stockBajo'
    summary: catalog publica cuando el disponible cruza el mínimo hacia abajo.
  catalogPublicaStockNoConfirmado:
    action: send
    channel:
      $ref: '#/channels/stockNoConfirmado'
    summary: catalog publica si un pago llega con la reserva vencida y sin stock.
  orderPublicaPedidoCreado:
    action: send
    channel:
      $ref: '#/channels/pedidoCreado'
    summary: order publica al confirmar el checkout (T1).
  orderPublicaPedidoPagado:
    action: send
    channel:
      $ref: '#/channels/pedidoPagado'
    summary: order publica al pasar el pedido a PAGADO.
  orderPublicaPedidoCancelado:
    action: send
    channel:
      $ref: '#/channels/pedidoCancelado'
    summary: order publica al cancelar (cliente o staff).
  orderPublicaPedidoExpirado:
    action: send
    channel:
      $ref: '#/channels/pedidoExpirado'
    summary: order publica al vencer un pedido sin pago.
  orderPublicaPagoNoAplicable:
    action: send
    channel:
      $ref: '#/channels/pagoNoAplicable'
    summary: order publica si un pago llega con el pedido ya expirado o cancelado.
  orderPublicaPedidoListoDespacho:
    action: send
    channel:
      $ref: '#/channels/pedidoListoDespacho'
    summary: order publica al dejar listo un pedido de delivery o agencia.
  orderPublicaPedidoListoRecojo:
    action: send
    channel:
      $ref: '#/channels/pedidoListoRecojo'
    summary: order publica al dejar listo un pedido de recojo.
  orderPublicaPedidoRecogido:
    action: send
    channel:
      $ref: '#/channels/pedidoRecogido'
    summary: order publica cuando el cliente recoge en tienda.
  orderPublicaReembolsoSolicitado:
    action: send
    channel:
      $ref: '#/channels/reembolsoSolicitado'
    summary: order publica al registrar un reembolso postventa.
  paymentPublicaPagoConfirmado:
    action: send
    channel:
      $ref: '#/channels/pagoConfirmado'
    summary: payment publica al aprobarse un cargo (T3).
  paymentPublicaPagoRechazado:
    action: send
    channel:
      $ref: '#/channels/pagoRechazado'
    summary: payment publica al rechazarse un cargo.
  paymentPublicaBoletaEmitida:
    action: send
    channel:
      $ref: '#/channels/boletaEmitida'
    summary: payment publica al generar la boleta (T6).
  paymentPublicaPagoReembolsado:
    action: send
    channel:
      $ref: '#/channels/pagoReembolsado'
    summary: payment publica al completar (o resolver a mano) un reembolso.
  paymentPublicaReembolsoFallido:
    action: send
    channel:
      $ref: '#/channels/reembolsoFallido'
    summary: payment publica tras el cuarto intento fallido de un reembolso.
  deliveryPublicaEntregaActualizada:
    action: send
    channel:
      $ref: '#/channels/entregaActualizada'
    summary: delivery publica en cada cambio de estado de una entrega.
  settingsPublicaConfiguracionActualizada:
    action: send
    channel:
      $ref: '#/channels/configuracionActualizada'
    summary: settings publica al guardar una sección o una imagen.
  settingsPublicaReclamoRegistrado:
    action: send
    channel:
      $ref: '#/channels/reclamoRegistrado'
    summary: settings publica al registrar un reclamo.
  settingsPublicaReclamoRespondido:
    action: send
    channel:
      $ref: '#/channels/reclamoRespondido'
    summary: settings publica al responder un reclamo.

  # --- Consumidores (receive) ---
  notificationRecibeClienteRegistrado:
    action: receive
    channel:
      $ref: '#/channels/clienteRegistrado'
    summary: Correo C1 (bienvenida).
  notificationRecibePasswordResetSolicitado:
    action: receive
    channel:
      $ref: '#/channels/passwordResetSolicitado'
    summary: Correo C2 (recuperación) o C3 (invitación) según `motivo`.
  notificationRecibePasswordCambiado:
    action: receive
    channel:
      $ref: '#/channels/passwordCambiado'
    summary: Correo C4 (aviso de seguridad).
  notificationRecibeStockBajo:
    action: receive
    channel:
      $ref: '#/channels/stockBajo'
    summary: Alerta T1 a los correos para alertas.
  notificationRecibeStockNoConfirmado:
    action: receive
    channel:
      $ref: '#/channels/stockNoConfirmado'
    summary: Alerta T2.
  paymentRecibePedidoCreado:
    action: receive
    channel:
      $ref: '#/channels/pedidoCreado'
    summary: Crea la intención de pago (T2).
  notificationRecibePedidoCreado:
    action: receive
    channel:
      $ref: '#/channels/pedidoCreado'
    summary: Guarda la copia del resumen del pedido (sin correo).
  catalogRecibePedidoPagado:
    action: receive
    channel:
      $ref: '#/channels/pedidoPagado'
    summary: Confirma la reserva y descuenta el físico (T5).
  notificationRecibePedidoPagado:
    action: receive
    channel:
      $ref: '#/channels/pedidoPagado'
    summary: Inicia el respaldo de 10 min de la confirmación sin boleta.
  catalogRecibePedidoCancelado:
    action: receive
    channel:
      $ref: '#/channels/pedidoCancelado'
    summary: Libera la reserva o reingresa el stock si fue pagado.
  paymentRecibePedidoCancelado:
    action: receive
    channel:
      $ref: '#/channels/pedidoCancelado'
    summary: Reembolso total si fue pagado; si no, anula la intención.
  notificationRecibePedidoCancelado:
    action: receive
    channel:
      $ref: '#/channels/pedidoCancelado'
    summary: Correo C6.
  catalogRecibePedidoExpirado:
    action: receive
    channel:
      $ref: '#/channels/pedidoExpirado'
    summary: Libera la reserva.
  paymentRecibePedidoExpirado:
    action: receive
    channel:
      $ref: '#/channels/pedidoExpirado'
    summary: Anula la intención.
  paymentRecibePagoNoAplicable:
    action: receive
    channel:
      $ref: '#/channels/pagoNoAplicable'
    summary: Reembolso total automático.
  deliveryRecibePedidoListoDespacho:
    action: receive
    channel:
      $ref: '#/channels/pedidoListoDespacho'
    summary: Crea la entrega.
  notificationRecibePedidoListoRecojo:
    action: receive
    channel:
      $ref: '#/channels/pedidoListoRecojo'
    summary: Correo C10 (listo para recoger).
  notificationRecibePedidoRecogido:
    action: receive
    channel:
      $ref: '#/channels/pedidoRecogido'
    summary: Correo C11 (entregado).
  paymentRecibeReembolsoSolicitado:
    action: receive
    channel:
      $ref: '#/channels/reembolsoSolicitado'
    summary: Crea el reembolso POSTVENTA (idempotente por solicitudId).
  orderRecibePagoConfirmado:
    action: receive
    channel:
      $ref: '#/channels/pagoConfirmado'
    summary: Pasa el pedido a PAGADO (o publica PagoNoAplicable).
  orderRecibePagoRechazado:
    action: receive
    channel:
      $ref: '#/channels/pagoRechazado'
    summary: Anota el rechazo en el historial.
  orderRecibeBoletaEmitida:
    action: receive
    channel:
      $ref: '#/channels/boletaEmitida'
    summary: Guarda la URL de la boleta.
  notificationRecibeBoletaEmitida:
    action: receive
    channel:
      $ref: '#/channels/boletaEmitida'
    summary: Correo C5 (pedido confirmado) con la boleta adjunta.
  notificationRecibePagoReembolsado:
    action: receive
    channel:
      $ref: '#/channels/pagoReembolsado'
    summary: Correo C7 (reembolso realizado, parcial o total).
  orderRecibePagoReembolsado:
    action: receive
    channel:
      $ref: '#/channels/pagoReembolsado'
    summary: Actualiza monto_reembolsado (si trae solicitudId).
  notificationRecibeReembolsoFallido:
    action: receive
    channel:
      $ref: '#/channels/reembolsoFallido'
    summary: Alerta T3.
  orderRecibeEntregaActualizada:
    action: receive
    channel:
      $ref: '#/channels/entregaActualizada'
    summary: Pasa el pedido a ENVIADO, ENTREGADO o DEVUELTO, o anota el intento fallido.
  notificationRecibeEntregaActualizada:
    action: receive
    channel:
      $ref: '#/channels/entregaActualizada'
    summary: Correos C8, C9, C10, C11 o C14 según el estado.
  notificationRecibeConfiguracionActualizada:
    action: receive
    channel:
      $ref: '#/channels/configuracionActualizada'
    summary: Actualiza la copia de la marca y los correos para alertas.
  notificationRecibeReclamoRegistrado:
    action: receive
    channel:
      $ref: '#/channels/reclamoRegistrado'
    summary: Correo C12 al consumidor y alerta T4 a la tienda.
  notificationRecibeReclamoRespondido:
    action: receive
    channel:
      $ref: '#/channels/reclamoRespondido'
    summary: Correo C13.

components:
  channelBindings:
    fitstoreEventos:
      amqp:
        is: routingKey
        exchange:
          name: fitstore.eventos
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0

  messages:
    ClienteRegistrado:
      name: ClienteRegistrado
      title: Cliente registrado
      payload:
        $ref: '#/components/schemas/SobreClienteRegistrado'
    PasswordResetSolicitado:
      name: PasswordResetSolicitado
      title: Recuperación o invitación solicitada
      payload:
        $ref: '#/components/schemas/SobrePasswordResetSolicitado'
    PasswordCambiado:
      name: PasswordCambiado
      title: Contraseña cambiada
      payload:
        $ref: '#/components/schemas/SobrePasswordCambiado'
    StockBajo:
      name: StockBajo
      title: Stock bajo
      payload:
        $ref: '#/components/schemas/SobreStockBajo'
    StockNoConfirmado:
      name: StockNoConfirmado
      title: Pago confirmado sin stock
      payload:
        $ref: '#/components/schemas/SobreStockNoConfirmado'
    PedidoCreado:
      name: PedidoCreado
      title: Pedido creado
      payload:
        $ref: '#/components/schemas/SobrePedidoCreado'
    PedidoPagado:
      name: PedidoPagado
      title: Pedido pagado
      payload:
        $ref: '#/components/schemas/SobrePedidoPagado'
    PedidoCancelado:
      name: PedidoCancelado
      title: Pedido cancelado
      payload:
        $ref: '#/components/schemas/SobrePedidoCancelado'
    PedidoExpirado:
      name: PedidoExpirado
      title: Pedido expirado
      payload:
        $ref: '#/components/schemas/SobrePedidoExpirado'
    PagoNoAplicable:
      name: PagoNoAplicable
      title: Pago no aplicable
      payload:
        $ref: '#/components/schemas/SobrePagoNoAplicable'
    PedidoListoDespacho:
      name: PedidoListoDespacho
      title: Pedido listo para despacho
      payload:
        $ref: '#/components/schemas/SobrePedidoListoDespacho'
    PedidoListoRecojo:
      name: PedidoListoRecojo
      title: Pedido listo para recoger
      payload:
        $ref: '#/components/schemas/SobrePedidoRecojo'
    PedidoRecogido:
      name: PedidoRecogido
      title: Pedido recogido en tienda
      payload:
        $ref: '#/components/schemas/SobrePedidoRecojo'
    ReembolsoSolicitado:
      name: ReembolsoSolicitado
      title: Reembolso postventa solicitado
      payload:
        $ref: '#/components/schemas/SobreReembolsoSolicitado'
    PagoConfirmado:
      name: PagoConfirmado
      title: Pago confirmado
      payload:
        $ref: '#/components/schemas/SobrePagoConfirmado'
    PagoRechazado:
      name: PagoRechazado
      title: Pago rechazado
      payload:
        $ref: '#/components/schemas/SobrePagoRechazado'
    BoletaEmitida:
      name: BoletaEmitida
      title: Boleta emitida
      payload:
        $ref: '#/components/schemas/SobreBoletaEmitida'
    PagoReembolsado:
      name: PagoReembolsado
      title: Reembolso completado
      payload:
        $ref: '#/components/schemas/SobrePagoReembolsado'
    ReembolsoFallido:
      name: ReembolsoFallido
      title: Reembolso fallido
      payload:
        $ref: '#/components/schemas/SobreReembolsoFallido'
    EntregaActualizada:
      name: EntregaActualizada
      title: Entrega actualizada
      payload:
        $ref: '#/components/schemas/SobreEntregaActualizada'
    ConfiguracionActualizada:
      name: ConfiguracionActualizada
      title: Configuración de tienda actualizada
      payload:
        $ref: '#/components/schemas/SobreConfiguracionActualizada'
    ReclamoRegistrado:
      name: ReclamoRegistrado
      title: Reclamo registrado
      payload:
        $ref: '#/components/schemas/SobreReclamoRegistrado'
    ReclamoRespondido:
      name: ReclamoRespondido
      title: Reclamo respondido
      payload:
        $ref: '#/components/schemas/SobreReclamoRespondido'

  schemas:
    Sobre:
      type: object
      required: [eventoId, tipo, version, ocurridoEn, datos]
      properties:
        eventoId:
          type: string
          format: uuid
          description: Clave de idempotencia del consumidor (evento_procesado).
        tipo:
          type: string
          description: Nombre del evento (p. ej. PedidoCreado).
        version:
          type: integer
          const: 1
        ocurridoEn:
          type: string
          format: date-time
        datos:
          type: object

    Monto:
      type: number
      multipleOf: 0.01
      minimum: 0
    Persona:
      type: object
      required: [nombre, email]
      properties:
        nombre:
          type: string
        email:
          type: string
          format: email
    Destinatario:
      type: object
      required: [nombres, apellidos, dni, telefono, email]
      properties:
        nombres:
          type: string
        apellidos:
          type: string
        dni:
          type: string
          pattern: '^[0-9]{8}$'
        telefono:
          type: string
        email:
          type: string
          format: email
    Direccion:
      type: object
      required: [ubigeo, departamento, provincia, distrito, direccion]
      properties:
        ubigeo:
          type: string
          pattern: '^[0-9]{6}$'
        departamento:
          type: string
        provincia:
          type: string
        distrito:
          type: string
        direccion:
          type: string
        referencia:
          type: [string, 'null']
    ItemCantidad:
      type: object
      required: [varianteId, cantidad]
      properties:
        varianteId:
          type: integer
        cantidad:
          type: integer
          minimum: 1
    ItemPedido:
      type: object
      required: [varianteId, sku, producto, talla, color, precioUnitario, cantidad, descuentoMonto, total]
      properties:
        varianteId:
          type: integer
        productoId:
          type: integer
        sku:
          type: string
        producto:
          type: string
        talla:
          type: string
        color:
          type: string
        imagenUrl:
          type: [string, 'null']
        precioUnitario:
          $ref: '#/components/schemas/Monto'
        cantidad:
          type: integer
        descuentoPorcentaje:
          type: number
        descuentoMonto:
          $ref: '#/components/schemas/Monto'
        total:
          $ref: '#/components/schemas/Monto'
    Modalidad:
      type: string
      enum: [DELIVERY_LOCAL, AGENCIA, RECOJO]

    SobreClienteRegistrado:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            datos:
              type: object
              required: [clienteId, email, nombres]
              properties:
                clienteId:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                nombres:
                  type: string
    SobrePasswordResetSolicitado:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            datos:
              type: object
              required: [cuentaId, tipoCuenta, email, nombres, motivo, enlace, expiraEn]
              properties:
                cuentaId:
                  type: string
                  format: uuid
                tipoCuenta:
                  type: string
                  enum: [CLIENTE, STAFF]
                email:
                  type: string
                  format: email
                nombres:
                  type: string
                motivo:
                  type: string
                  enum: [RECUPERACION, INVITACION]
                enlace:
                  type: string
                  description: URL al frontend que corresponde, con el token.
                expiraEn:
                  type: string
                  format: date-time
    SobrePasswordCambiado:
      allOf:
        - $ref: '#/components/schemas/Sobre'
