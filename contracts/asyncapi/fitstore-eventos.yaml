asyncapi: 3.0.0
info:
  title: FitStore — eventos de dominio
  version: 1.0.0
  description: |
    Todos los eventos del exchange `fitstore.eventos` (RabbitMQ, topic). Un canal por routing key `{servicio}.{entidad}.{acción}`.
    Cada servicio consumidor tiene su cola `{servicio}.eventos` (con DLQ `{servicio}.eventos.dlq`) enlazada a las routing keys que
    le interesan. Publicación con outbox y *publisher confirms*; consumo idempotente por `eventoId` (ADR-009).

    **Sobre común (K12):** `{eventoId, tipo, version, ocurridoEn, datos}`; los campos propios de cada evento van en `datos`.
    Un consumidor ignora los campos que no conoce (compatibilidad hacia adelante).

    Fuente: sección 6 de cada micro en `docs/analisis/micro/` y el catálogo de eventos del macro (5.3).
  license:
    name: Uso académico
defaultContentType: application/json

servers:
  local:
    host: rabbitmq:5672
    protocol: amqp
    description: RabbitMQ 4 en el docker compose (red interna; también en la nube, sin publicar).

