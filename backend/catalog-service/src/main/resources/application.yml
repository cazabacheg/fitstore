# Solo lo necesario para llegar al config-server; el resto (puerto, base de datos, eventos, almacenamiento) vive en
# infra/config-repo (application.yml y catalog-service*.yml).
spring:
  application:
    name: catalog-service
  cloud:
    config:
      # Sin valores por defecto: salen del entorno (.env), nunca de un archivo versionado
      username: ${CONFIG_USER}
      password: ${CONFIG_PASSWORD}
      # Si el config-server no responde no se arranca con valores por defecto (CA-0a-04)
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 2000
        max-interval: 10000
        multiplier: 1.5
---
# El perfil "sin-config-server" lo usan las pruebas, que no consultan al config-server
spring:
  config:
    activate:
      on-profile: "!sin-config-server"
    import: "configserver:http://${CONFIG_HOST:config-server}:8888"
