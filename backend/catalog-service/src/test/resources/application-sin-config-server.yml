# Propiedades de las pruebas: sustituyen a las del config-server (infra/config-repo/catalog-service*.yml).
spring:
  cloud:
    config:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  rabbitmq:
    publisher-confirm-type: correlated
  data:
    redis:
      timeout: 500ms
  security:
    oauth2:
      resourceserver:
        jwt:
          # Nunca se consulta: las pruebas no validan tokens. Evita que falle la creación del JwtDecoder.
          jwk-set-uri: http://localhost:9/.well-known/jwks.json
eureka:
  client:
    enabled: false
fitstore:
  eventos:
    servicio: catalog
    # Las pruebas de eventos lo encienden con un RabbitMQ en Testcontainers
    escuchar: false
    enlaces:
      - order.pedido.pagado
      - order.pedido.cancelado
      - order.pedido.expirado
  outbox:
    # Habilitado para poder leer outbox_evento; el publicador solo corre cada hora (las pruebas de eventos lo aceleran)
    habilitado: true
    intervalo-ms: 3600000
  storage:
    # Sin Garage: el endpoint no se consulta. ImagenServiceTest lo apunta a un Garage en Testcontainers.
    habilitado: true
    endpoint: http://localhost:9
    access-key: GKprueba
    secret-key: clave-de-prueba-sin-valor
    media-base-url: http://media.prueba/media
  catalogo:
    cache:
      # Las pruebas de caché lo encienden con un Redis en Testcontainers
      habilitado: false
  inventario:
    liberador-reservas-cron: "-"
springdoc:
  api-docs:
    version: openapi_3_0
management:
  health:
    # Las pruebas de arranque no levantan Redis ni RabbitMQ: su salud no es lo que se verifica
    redis:
      enabled: false
    rabbit:
      enabled: false
