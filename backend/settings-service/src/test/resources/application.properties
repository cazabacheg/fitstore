# Pruebas: sin config-server ni Eureka (el application.yml principal solo importa config-server fuera de "pruebas");
# el JWKS no se consulta hasta que llega un token
spring.profiles.active=pruebas
eureka.client.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9/jwks-prueba
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
management.health.redis.enabled=false
management.health.rabbit.enabled=false
# Eventos (outbox): se registran en la base; el publicador no corre durante la prueba
fitstore.eventos.servicio=settings
fitstore.outbox.habilitado=true
fitstore.outbox.intervalo-ms=3600000
spring.rabbitmq.publisher-confirm-type=correlated
# Redis cae rápido si no responde (ADR-020)
spring.data.redis.timeout=500ms
