# Perfil de pruebas: sin config-server ni Eureka, con la seguridad activa (jwk-set-uri ficticio, solo para pruebas)
spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9/jwks-ficticio-solo-pruebas
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    # GreenMail de las pruebas de envío (ServerSetupTest.SMTP); sin él, el envío falla como un SMTP caído
    host: localhost
    port: 3025
  rabbitmq:
    # Puerto sin broker: si en la máquina corre el RabbitMQ de la plataforma (5672), las pruebas no deben
    # conectarse a él. Las pruebas de integración lo reemplazan con el de Testcontainers.
    port: 56720
    listener:
      simple:
        # Solo las pruebas de integración con RabbitMQ (EnrutadorEventosIT) arrancan el consumidor
        auto-startup: false
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
management:
  health:
    redis:
      enabled: false
    rabbit:
      enabled: false
    mail:
      enabled: false
fitstore:
  eventos:
    servicio: notification
    enlaces:
      - auth.cliente.registrado
      - auth.password.reset-solicitado
      - auth.password.cambiado
      - catalog.stock.bajo
      - catalog.stock.no-confirmado
      - order.pedido.creado
      - order.pedido.pagado
      - order.pedido.cancelado
      - order.pedido.listo-recojo
      - order.pedido.recogido
      - payment.boleta.emitida
      - payment.reembolso.completado
      - payment.reembolso.fallido
      - delivery.entrega.actualizada
      - settings.configuracion.actualizada
      - settings.reclamo.registrado
      - settings.reclamo.respondido
    esperaInicialMs: 50
  outbox:
    habilitado: false
  notificacion:
    remitente: tienda@fitstore.test
    ritmo-por-segundo: 2
    reintentos: [1m, 5m, 15m, 60m]
    confirmacion-sin-boleta-tras: 10m
    retencion: 180d
    programacion-habilitada: false   # las pruebas llaman a despachar() y revisar() a mano
    payment-url: ""
    settings-url: ""
    enlaces:
      storefront: http://tienda.test
      backoffice: http://admin.test
