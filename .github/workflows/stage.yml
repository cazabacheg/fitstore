# Integración completa (ADR-021): PR y push a stage, PR a main. Construye las imágenes, levanta el compose completo
# en el runner (entorno efímero), corre infra/smoke.sh y la colección Postman base con Newman.
# SPEC-8: tras Newman corren las pruebas E2E con Playwright (CA-8-06 a CA-8-11) y Lighthouse CI (CA-8-12) contra los
# frontends compilados y servidos por Caddy, sobre la misma plataforma. deploy.yml (push a main) despliega en la nube.
name: stage

on:
  pull_request:
    branches: [stage, main]
  push:
    branches: [stage]

permissions:
  contents: read

concurrency:
  group: stage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plataforma:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      # CA-0a-02, 03, 05, 07, 17, 19: infra/smoke.sh construye las imágenes (docker compose build), levanta el compose
      # de dev, espera a que todo quede healthy y verifica los criterios de humo. La plataforma sigue arriba para Newman.
      - name: Humo (smoke.sh)
        run: |
          # CA-0a-02
          infra/smoke.sh
      # CA-0a-17 La colección base verifica el health del gateway y la documentación de los 7 servicios por el gateway.
      # Después corren las colecciones de cada spec (postman/<servicio>.postman_collection.json), que agregan las specs 1–7.
      - name: Postman con Newman 6.2.2 (base y una colección por servicio)
        run: |
          # CA-0a-17
          set -euo pipefail
          for coleccion in postman/fitstore-base.postman_collection.json \
            $(ls postman/*.postman_collection.json | grep -v fitstore-base); do
            echo "== $coleccion =="
            npx --yes newman@6.2.2 run "$coleccion" --environment postman/local.postman_environment.json
          done
      # CA-8-11 Frontends compilados y servidos por la misma imagen de Caddy que usa la nube (tienda :4200, backoffice :4300)
      - name: Compilar los frontends y levantar Caddy local
        run: |
          # CA-8-11
          set -euo pipefail
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          docker run -d --name caddy-local --network host \
            -v "$PWD/infra/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/frontend/dist/storefront/browser:/srv/tienda:ro" \
            -v "$PWD/frontend/dist/backoffice/browser:/srv/admin:ro" \
            caddy:2.11.3
          for i in $(seq 1 30); do curl -fsS http://localhost:4200/ >/dev/null && curl -fsS http://localhost:4300/ >/dev/null && exit 0; sleep 2; done
          exit 1
      # CA-8-06 a CA-8-11 Compra, despacho, white-label, reclamo y dashboard en Chromium, con el pago simulado y la API de
      # Mailpit para los correos (I3). Las capturas y el video de cada fallo se suben como artefacto.
      - name: E2E con Playwright
        working-directory: frontend
        env:
          CI: 'true'
        run: |
          # CA-8-11
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Artefactos de las E2E (capturas y video de los fallos)
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: e2e-resultados
          path: |
            frontend/e2e-resultados
            frontend/playwright-report
          if-no-files-found: ignore
      # CA-8-12 Lighthouse móvil sobre la landing, el listado y el detalle. Umbral 85 en rendimiento y accesibilidad;
      # según el brief, si no llega se reporta el puntaje y NO bloquea (continue-on-error).
      - name: Lighthouse CI
        id: lighthouse
        continue-on-error: true
        working-directory: frontend
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          # CA-8-12
          npx lhci autorun --config=lighthouserc.json
      - name: Resultado de Lighthouse en el resumen
        if: always()
        run: |
          echo "### Lighthouse CI (umbral 85, no bloqueante)" >> "$GITHUB_STEP_SUMMARY"
          echo "Resultado del paso: ${{ steps.lighthouse.outcome }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Informes de Lighthouse
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lighthouse-resultados
          path: frontend/lighthouse-resultados
          if-no-files-found: ignore
      - name: Registros de los contenedores si algo falló
        if: failure()
        run: |
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml ps -a
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml logs --tail 200
      - name: Bajar Caddy local
        if: always()
        run: docker rm -f caddy-local || true
      - name: Bajar la plataforma
        if: always()
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml down -v --remove-orphans
